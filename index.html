    <script>
      // Replace subject icons with images
      function replaceSubjectIcons() {
        const subjectMap = {
          '语文': 'chinese.png',
          '数学': 'math.png',
          '英语': 'english.png',
          '物理': 'physics.png',
          '化学': 'chemistry.png',
          '地理': 'geography.png'
        };
        
        document.querySelectorAll('.subj-head').forEach(head => {
          const nameEl = head.querySelector('.subj-name');
          const icoEl = head.querySelector('.subj-ico');
          if (!nameEl || !icoEl) return;
          
          const name = nameEl.textContent.trim();
          if (subjectMap[name]) {
            icoEl.style.backgroundImage = `url('./subjects/${subjectMap[name]}')`;
            icoEl.style.backgroundSize = 'cover';
            icoEl.style.backgroundPosition = 'center';
            icoEl.textContent = '';
            icoEl.style.fontSize = '0';
            
            // Move name to left of icon
            head.style.flexDirection = 'row';
            nameEl.style.order = '-1';
          }
        });
      }
      
      // Replace home greeting text
      function replaceGreeting() {
        // Find home page greeting title
        const greetTitles = document.querySelectorAll('.greet-title');
        greetTitles.forEach(title => {
          if (title.textContent.includes('今天也要') || title.textContent.includes('闪闪发光')) {
            title.innerHTML = '我が名は<span class="accent">シャドウ</span>。';
          }
        });
      }
      
      // Add "加料" button to goals page
      function addAddButton() {
        // Check if already added
        if (document.querySelector('.add-goal-btn-custom')) return;
        
        // Find goals page by looking for "记录目标" title
        const greetTitles = document.querySelectorAll('.greet-title');
        let goalsPage = null;
        greetTitles.forEach(title => {
          if (title.textContent.includes('记录') && title.textContent.includes('目标')) {
            goalsPage = title.closest('.page');
          }
        });
        
        if (!goalsPage) return;
        
        // Add button at top
        const btn = document.createElement('button');
        btn.className = 'add-goal-btn-custom btn btn-primary';
        btn.textContent = '✨ 加料';
        btn.style.cssText = 'margin: 0 0 16px; width: 100%; border-radius: 16px; padding: 14px; font-size: 1rem; font-weight: 600;';
        btn.onclick = openAddGoalModal;
        
        const greet = goalsPage.querySelector('.greet');
        if (greet) {
          greet.after(btn);
        }
      }

          align-items: center;
          justify-content: center;
          padding: 20px;
        `;

        `;

                <span style="font-size: 0.95rem; font-weight: 500; color: #333;">英语</span>

              font-size: 1rem;
              box-sizing: border-box;
            ">
          </div>
          <div style="display: flex; gap: 12px;">
            <button id="add-goal-cancel" style="
              flex: 1;
              padding: 12px;
              border: 1px solid #e0e0e0;
              border-radius: 12px;
              background: white;
              font-size: 1rem;
              font-weight: 600;
              cursor: pointer;
            ">取消</button>
            <button id="add-goal-confirm" style="
              flex: 1;
              padding: 12px;
              border: none;
              border-radius: 12px;
              background: linear-gradient(135deg, #c47f3a, #d4a06a);
              color: white;
              font-size: 1rem;
              font-weight: 600;
              cursor: pointer;
            ">确认加料</button>
          </div>

        modal.appendChild(content);
        document.body.appendChild(modal);
        
        // Subject selection
        let selectedSubject = null;
        const subjectNames = {
          'chinese': '语文',
          'math': '数学',
          'english': '英语',
          'physics': '物理',
          'chemistry': '化学',
          'geography': '地理'
        };
        
        content.querySelectorAll('.subject-row').forEach(row => {
          row.onclick = () => {
            // Remove all selected
            content.querySelectorAll('.subject-row').forEach(r => {
              r.style.borderColor = 'transparent';
              r.style.background = '#f8f8f8';
            });
            // Add selected
            row.style.borderColor = '#c47f3a';
            row.style.background = '#faf0e3';
            selectedSubject = row.dataset.subject;
          };
        });
        
        // Cancel button
        content.querySelector('#add-goal-cancel').onclick = () => {
          document.body.removeChild(modal);
        };
        
        // Confirm button
        content.querySelector('#add-goal-confirm').onclick = () => {
          if (!selectedSubject) {
            alert('请先选择科目');
            return;
          }
          const text = content.querySelector('#add-goal-text').value.trim();
          if (!text) {
            alert('请输入目标内容');
            return;
          }
          
          // Save to localStorage
          const today = new Date();
          const dateKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
          
          let allData = {};
          try {
            allData = JSON.parse(localStorage.getItem('cd_v5') || '{}');
          } catch {}
          
          if (!allData[dateKey]) {
            allData[dateKey] = {
              teacherSubjectRecords: {},
              todayGoals: {},
              tomorrowGoals: {},
              myRecords: {},
              aiPlan: '',
              aiAnalysis: '',
              reflection: ''
            };
          }
          
          if (!allData[dateKey].todayGoals[selectedSubject]) {
            allData[dateKey].todayGoals[selectedSubject] = [];
          }
          
          allData[dateKey].todayGoals[selectedSubject].push({
            id: 'goal_' + Date.now(),
            text: text,
            done: false
          });
          
          localStorage.setItem('cd_v5', JSON.stringify(allData));
          
          // Close modal and reload
          document.body.removeChild(modal);
          location.reload();
        };
        
        // Click outside to close
        modal.onclick = (e) => {
          if (e.target === modal) {
            document.body.removeChild(modal);
          }
        };
      }
      
      // Run after page loads
      setTimeout(() => {
        replaceSubjectIcons();
        replaceGreeting();
        addAddButton();
      }, 1000);
      setInterval(() => {
        replaceSubjectIcons();
        replaceGreeting();
        addAddButton();
      }, 1000);
