    <script>
      // 所有代码都用try-catch包裹，防止报错
      try {
        // 科目图标映射
        var subjectMap = {
          '语文': 'chinese.png',
          '数学': 'math.png',
          '英语': 'english.png',
          '物理': 'physics.png',
          '化学': 'chemistry.png',
          '地理': 'geography.png'
        };
        
        // 替换科目图标
        function replaceSubjectIcons() {
          var heads = document.querySelectorAll('.subj-head');
          for (var i = 0; i < heads.length; i++) {
            var head = heads[i];
            var nameEl = head.querySelector('.subj-name');
            var icoEl = head.querySelector('.subj-ico');
            if (!nameEl || !icoEl) continue;
            
            var name = nameEl.textContent.trim();
            if (subjectMap[name]) {
              icoEl.style.backgroundImage = 'url(./subjects/' + subjectMap[name] + ')';
              icoEl.style.backgroundSize = 'cover';
              icoEl.style.backgroundPosition = 'center';
              icoEl.textContent = '';
              icoEl.style.fontSize = '0';
            }
          }
        }
        
        // 替换主标语
        function replaceGreeting() {
          var titles = document.querySelectorAll('.greet-title');
          for (var i = 0; i < titles.length; i++) {
            var title = titles[i];
            if (title.textContent.indexOf('今天也要') !== -1 || title.textContent.indexOf('闪闪发光') !== -1) {
              title.innerHTML = '我が名は<span class="accent">シャドウ</span>。';
            }
          }
        }
        
        // 打开加料弹窗
        function openAddModal() {
          // 创建遮罩
          var mask = document.createElement('div');
          mask.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
          
          // 创建弹窗内容
          var content = document.createElement('div');
          content.style.cssText = 'background:white;border-radius:24px;padding:24px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;';
          
          // 弹窗HTML
          var subjectNames = ['语文', '数学', '英语', '物理', '化学', '地理'];
          var subjectKeys = ['chinese', 'math', 'english', 'physics', 'chemistry', 'geography'];
          var subjectHTML = '';
          for (var i = 0; i < subjectNames.length; i++) {
            subjectHTML += '<button class="subject-row" data-key="' + subjectKeys[i] + '" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:2px solid transparent;background:#f8f8f8;cursor:pointer;width:100%;text-align:left;margin-bottom:8px;">' +
              '<div style="width:40px;height:40px;border-radius:50%;background-image:url(./subjects/' + subjectKeys[i] + '.png);background-size:cover;background-position:center;flex-shrink:0;"></div>' +
              '<span style="font-size:0.95rem;font-weight:500;color:#333;">' + subjectNames[i] + '</span>' +
            '</button>';
          }
          
          content.innerHTML = 
            '<h3 style="margin:0 0 20px;font-size:1.25rem;font-weight:700;">✨ 加料</h3>' +
            '<div style="margin-bottom:16px;">' +
              '<label style="display:block;margin-bottom:12px;font-size:0.875rem;font-weight:600;color:#666;">选择科目</label>' +
              '<div id="subject-list">' + subjectHTML + '</div>' +
            '</div>' +
            '<div style="margin-bottom:20px;">' +
              '<label style="display:block;margin-bottom:8px;font-size:0.875rem;font-weight:600;color:#666;">目标内容</label>' +
              '<input id="goal-text" type="text" placeholder="例如：完成数学练习册第3章" style="width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:12px;font-size:1rem;box-sizing:border-box;">' +
            '</div>' +
            '<div style="display:flex;gap:12px;">' +
              '<button id="cancel-btn" style="flex:1;padding:12px;border:1px solid #e0e0e0;border-radius:12px;background:white;font-size:1rem;font-weight:600;cursor:pointer;">取消</button>' +
              '<button id="confirm-btn" style="flex:1;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#c47f3a,#d4a06a);color:white;font-size:1rem;font-weight:600;cursor:pointer;">确认加料</button>' +
            '</div>';
          
          mask.appendChild(content);
          document.body.appendChild(mask);
          
          var selectedSubject = null;
          
          // 科目选择
          var rows = content.querySelectorAll('.subject-row');
          for (var i = 0; i < rows.length; i++) {
            rows[i].onclick = function() {
              for (var j = 0; j < rows.length; j++) {
                rows[j].style.borderColor = 'transparent';
                rows[j].style.background = '#f8f8f8';
              }
              this.style.borderColor = '#c47f3a';
              this.style.background = '#faf0e3';
              selectedSubject = this.dataset.key;
            };
          }
          
          // 取消按钮
          content.querySelector('#cancel-btn').onclick = function() {
            document.body.removeChild(mask);
          };
          
          // 确认按钮
          content.querySelector('#confirm-btn').onclick = function() {
            if (!selectedSubject) {
              alert('请先选择科目');
              return;
            }
            var text = content.querySelector('#goal-text').value.trim();
            if (!text) {
              alert('请输入目标内容');
              return;
            }
            
            // 保存到localStorage
            var today = new Date();
            var dateKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
            
            var allData = {};
            try {
              allData = JSON.parse(localStorage.getItem('cd_v5') || '{}');
            } catch(e) {}
            
            if (!allData[dateKey]) {
              allData[dateKey] = {
                teacherSubjectRecords: {},
                todayGoals: {},
                tomorrowGoals: {},
                myRecords: {},
                aiPlan: '',
                aiAnalysis: '',
                reflection: ''
              };
            }
            
            if (!allData[dateKey].todayGoals[selectedSubject]) {
              allData[dateKey].todayGoals[selectedSubject] = [];
            }
            
            allData[dateKey].todayGoals[selectedSubject].push({
              id: 'goal_' + Date.now(),
              text: text,
              done: false
            });
            
            localStorage.setItem('cd_v5', JSON.stringify(allData));
            
            document.body.removeChild(mask);
            location.reload();
          };
          
          // 点击遮罩关闭
          mask.onclick = function(e) {
            if (e.target === mask) {
              document.body.removeChild(mask);
            }
          };
        }
        
        // 替换标题为蒙版渐变文字
        function replaceMaskedTitle() {
          if (document.querySelector('.masked-title')) return;
          
          var header = document.querySelector('.header');
          if (!header) return;
          var titleDiv = header.querySelector('.header-title');
          if (!titleDiv) return;
          
          var oldText = titleDiv.textContent.trim();
          if (oldText === 'Mikou' || oldText.indexOf('拾光') !== -1 || oldText.indexOf('学习助手') !== -1) {
            titleDiv.innerHTML = '<div class="masked-title"><span class="masked-title__text">Mikou</span></div>';
          }
        }
        
        // 加加料按钮到今日目标卡片
        function addAddButton() {
          if (document.querySelector('.add-goal-btn-custom')) return;
          
          var cards = document.querySelectorAll('.card');
          var todayCard = null;
          for (var i = 0; i < cards.length; i++) {
            var card = cards[i];
            var titles = card.querySelectorAll('h3, .card-title, .subj-title, .title');
            for (var j = 0; j < titles.length; j++) {
              if (titles[j].textContent.indexOf('今日目标') !== -1) {
                todayCard = card;
                break;
              }
            }
            if (todayCard) break;
          }
          
          if (!todayCard) return;
          
          var btn = document.createElement('button');
          btn.className = 'add-goal-btn-custom btn btn-primary';
          btn.textContent = '✨ 加料';
          btn.style.cssText = 'width:100%;border-radius:16px;padding:14px;font-size:1rem;font-weight:600;margin-top:12px;';
          btn.onclick = openAddModal;
          
          todayCard.appendChild(btn);
        }
        
        // 定时执行
        setTimeout(function() {
          replaceSubjectIcons();
          replaceGreeting();
          replaceMaskedTitle();
          addAddButton();
        }, 1500);
        
        setInterval(function() {
          replaceSubjectIcons();
          replaceGreeting();
          replaceMaskedTitle();
          addAddButton();
        }, 1000);
        
      } catch(e) {
        console.error('自定义代码错误:', e);
      }
    </script>
